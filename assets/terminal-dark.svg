<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="850" height="420" role="img" aria-label="Leonardo Marciano - Tokyo Night Terminal Profile">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24283b"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0af68"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <clipPath id="cmdClip">
      <rect x="78" y="48" width="0" height="24">
        <animate attributeName="width" from="0" to="220" dur="1.1s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>
    <style>
      .mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .title { font-size: 12px; fill: #565f89; font-weight: 500; }
      .prompt-user { font-size: 13.5px; fill: #9ece6a; font-weight: 700; }
      .prompt-sym { font-size: 13.5px; fill: #565f89; }
      .prompt-path { font-size: 13.5px; fill: #7aa2f7; font-weight: 700; }
      .prompt-cmd { font-size: 13.5px; fill: #7dcfff; }
      .hdr-user { font-size: 15px; fill: #7aa2f7; font-weight: 700; }
      .hdr-host { font-size: 15px; fill: #bb9af7; font-weight: 700; }
      .key { font-size: 13.5px; fill: #7aa2f7; font-weight: 700; }
      .sep { font-size: 13.5px; fill: #565f89; }
      .val { font-size: 13.5px; fill: #c0caf5; }
      .val-hl { font-size: 13.5px; fill: #bb9af7; font-weight: 600; }
      .val-yellow { font-size: 13.5px; fill: #e0af68; }
      .val-green { font-size: 13.5px; fill: #9ece6a; }
      .muted { font-size: 11.5px; fill: #565f89; }
      .row { opacity: 0; animation: fadeIn 0.45s ease forwards; }
      .r1 { animation-delay: 0.70s; }
      .r2 { animation-delay: 0.80s; }
      .r3 { animation-delay: 0.90s; }
      .r4 { animation-delay: 1.00s; }
      .r5 { animation-delay: 1.10s; }
      .r6 { animation-delay: 1.20s; }
      .r7 { animation-delay: 1.30s; }
      .r8 { animation-delay: 1.40s; }
      .r9 { animation-delay: 1.50s; }
      .r10 { animation-delay: 1.60s; }
      .cursor { animation: blink 1.05s step-end infinite; }
      .pulse { animation: pulseAnim 2.4s ease-in-out infinite; }
      .twinkle1 { animation: twinkle 3.2s ease-in-out infinite; }
      .twinkle2 { animation: twinkle 4.1s ease-in-out infinite 1.1s; }
      .twinkle3 { animation: twinkle 2.8s ease-in-out infinite 0.5s; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
      @keyframes pulseAnim {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.2; }
      }
    </style>
  </defs>

  <!-- Outer Window -->
  <rect x="1" y="1" width="848" height="418" rx="12" fill="url(#bgGrad)" stroke="#292e42" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M 13 1.75 H 837 A 11.25 11.25 0 0 1 848.25 13 V 37 H 1.75 V 13 A 11.25 11.25 0 0 1 13 1.75 Z" fill="#16161e"/>
  <line x1="1.5" y1="37" x2="848.5" y2="37" stroke="#292e42" stroke-width="1"/>

  <!-- Traffic Lights -->
  <circle cx="22" cy="19.5" r="5.5" fill="#f7768e"/>
  <circle cx="40" cy="19.5" r="5.5" fill="#e0af68"/>
  <circle cx="58" cy="19.5" r="5.5" fill="#9ece6a"/>

  <!-- Window Title -->
  <text x="425" y="23.5" text-anchor="middle" class="mono title">leonardo@github: ~ — zsh</text>

  <!-- Top Command Prompt -->
  <text x="28" y="65" class="mono prompt-user">❯</text>
  <text x="46" y="65" class="mono prompt-path">~</text>
  <g clip-path="url(#cmdClip)">
    <text x="78" y="65" class="mono prompt-cmd">fastfetch --profile</text>
  </g>

  <!-- Left Visual Badge (Tokyo Night Emblem) -->
  <g class="row r1">
    <rect x="28" y="88" width="246" height="266" rx="10" fill="url(#cardGrad)" stroke="#292e42" stroke-width="1.2"/>

    <!-- Subtle Grid Line inside Card -->
    <line x1="28" y1="296" x2="274" y2="296" stroke="#292e42" stroke-width="1" stroke-dasharray="3 4"/>

    <!-- Stars -->
    <circle cx="62" cy="120" r="1.6" fill="#7dcfff" class="twinkle1"/>
    <circle cx="234" cy="116" r="1.4" fill="#bb9af7" class="twinkle2"/>
    <circle cx="212" cy="144" r="1.2" fill="#e0af68" class="twinkle3"/>
    <circle cx="76" cy="154" r="1.1" fill="#7aa2f7" class="twinkle2"/>
    <circle cx="188" cy="112" r="1.5" fill="#c0caf5" class="twinkle1"/>

    <!-- Crescent Moon -->
    <path d="M 164 118 A 26 26 0 1 0 192 154 A 20 20 0 1 1 164 118 Z" fill="url(#moonGrad)" opacity="0.95"/>

    <!-- Geometric Mountains -->
    <polygon points="48,248 96,184 144,248" fill="#1f2335" stroke="#414868" stroke-width="1"/>
    <polygon points="108,248 164,174 220,248" fill="#1a1b26" stroke="#7aa2f7" stroke-width="1.2" opacity="0.95"/>
    <polygon points="172,248 214,198 254,248" fill="#1f2335" stroke="#bb9af7" stroke-width="1" opacity="0.85"/>

    <!-- Code Monogram -->
    <text x="151" y="278" text-anchor="middle" class="mono" font-size="18" font-weight="700" fill="url(#accentGrad)">&lt;Leonardo /&gt;</text>

    <!-- Footer Tag inside Emblem -->
    <text x="151" y="321" text-anchor="middle" class="mono" font-size="12" fill="#7aa2f7" font-weight="600">@LeonardoBMar</text>
    <text x="151" y="340" text-anchor="middle" class="mono muted">tokyo-night · since 2021</text>
  </g>

  <!-- Right Column: Fastfetch Specs -->
  <g class="row r1">
    <text x="304" y="102" class="mono hdr-user">leonardo</text>
    <text x="377" y="102" class="mono sep">@</text>
    <text x="389" y="102" class="mono hdr-host">github.com</text>
    <line x1="304" y1="113" x2="818" y2="113" stroke="#292e42" stroke-width="1.2"/>
  </g>

  <g class="row r2">
    <text x="304" y="138" class="mono key">Role</text>
    <text x="404" y="138" class="mono sep">:</text>
    <text x="420" y="138" class="mono val-hl">Full-Stack Developer</text>
  </g>

  <g class="row r3">
    <text x="304" y="162" class="mono key">Languages</text>
    <text x="404" y="162" class="mono sep">:</text>
    <text x="420" y="162" class="mono val">TypeScript · JavaScript · SQL</text>
  </g>

  <g class="row r4">
    <text x="304" y="186" class="mono key">Frontend</text>
    <text x="404" y="186" class="mono sep">:</text>
    <text x="420" y="186" class="mono val">Next.js · React · Tailwind · Shadcn/UI</text>
  </g>

  <g class="row r5">
    <text x="304" y="210" class="mono key">Back &amp; DB</text>
    <text x="404" y="210" class="mono sep">:</text>
    <text x="420" y="210" class="mono val">Node.js · PostgreSQL · Drizzle · Prisma</text>
  </g>

  <g class="row r6">
    <text x="304" y="234" class="mono key">Infra</text>
    <text x="404" y="234" class="mono sep">:</text>
    <text x="420" y="234" class="mono val">Docker · CI/CD · Cloudflare · Vercel · Linux</text>
  </g>

  <g class="row r7">
    <text x="304" y="258" class="mono key">QA &amp; Test</text>
    <text x="404" y="258" class="mono sep">:</text>
    <text x="420" y="258" class="mono val">Playwright · Vitest · GitHub Actions</text>
  </g>

  <g class="row r8">
    <text x="304" y="282" class="mono key">Learning</text>
    <text x="404" y="282" class="mono sep">:</text>
    <text x="420" y="282" class="mono val-yellow">UI/UX Design &amp; Micro-interactions</text>
  </g>

  <g class="row r9">
    <text x="304" y="306" class="mono key">Status</text>
    <text x="404" y="306" class="mono sep">:</text>
    <circle cx="426" cy="301.5" r="4" fill="#9ece6a" class="pulse"/>
    <text x="438" y="306" class="mono val-green">Building modern web products</text>
  </g>

  <!-- Tokyo Night Color Swatches -->
  <g class="row r10">
    <rect x="304" y="330" width="26" height="16" rx="3" fill="#f7768e"/>
    <rect x="336" y="330" width="26" height="16" rx="3" fill="#ff9e64"/>
    <rect x="368" y="330" width="26" height="16" rx="3" fill="#e0af68"/>
    <rect x="400" y="330" width="26" height="16" rx="3" fill="#9ece6a"/>
    <rect x="432" y="330" width="26" height="16" rx="3" fill="#73daca"/>
    <rect x="464" y="330" width="26" height="16" rx="3" fill="#7dcfff"/>
    <rect x="496" y="330" width="26" height="16" rx="3" fill="#7aa2f7"/>
    <rect x="528" y="330" width="26" height="16" rx="3" fill="#bb9af7"/>
  </g>

  <!-- Bottom Interactive Prompt -->
  <g class="row r10">
    <text x="28" y="392" class="mono prompt-user">leonardo</text>
    <text x="94" y="392" class="mono prompt-sym">@</text>
    <text x="104" y="392" class="mono prompt-path">github</text>
    <text x="155" y="392" class="mono prompt-sym">:</text>
    <text x="165" y="392" class="mono prompt-path">~</text>
    <text x="178" y="392" class="mono" font-size="13.5" fill="#bb9af7">$</text>
    <rect x="194" y="380" width="8.5" height="15" rx="1.5" fill="#7dcfff" class="cursor"/>
  </g>
</svg>
